<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--! primary meta tags -->
    <title>Notekeeper - Your Everyday Notes | Effortless Note-Taking</title>
    <meta
      name="title"
      content="Notekeeper - Your Everyday Notes | Effortless Note-Taking"
    />
    <meta
      name="description"
      content="Streamline your daily note-taking with Notekeeper. Organize, access, and enhance productivity with ease. Your go-to platform for managing your everyday notes."
    />
    <!--! favicon -->
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <!--! theme (set before paint to avoid flash) -->
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("theme");
          var systemThemeIsDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var initialTheme =
            storedTheme || (systemThemeIsDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", initialTheme);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <!--! google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--! material icon -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
